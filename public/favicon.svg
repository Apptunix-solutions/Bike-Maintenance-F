<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background circle with primary color -->
  <rect width="256" height="256" fill="#167D9A" rx="32"/>
  
  <!-- Content group centered -->
  <g transform="translate(128, 128)">
    <!-- Left wheel -->
    <circle cx="-35" cy="0" r="28" fill="none" stroke="#F4F7F8" stroke-width="3"/>
    <circle cx="-35" cy="0" r="20" fill="none" stroke="#F4F7F8" stroke-width="1" opacity="0.4"/>
    <circle cx="-35" cy="0" r="4" fill="#F4F7F8"/>
    
    <!-- Right wheel -->
    <circle cx="35" cy="0" r="28" fill="none" stroke="#F4F7F8" stroke-width="3"/>
    <circle cx="35" cy="0" r="20" fill="none" stroke="#F4F7F8" stroke-width="1" opacity="0.4"/>
    <circle cx="35" cy="0" r="4" fill="#F4F7F8"/>
    
    <!-- Frame lines in accent color -->
    <line x1="-15" y1="-22" x2="0" y2="8" stroke="#F5A14A" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="35" y2="0" stroke="#F5A14A" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="-35" y2="0" stroke="#F5A14A" stroke-width="4" stroke-linecap="round"/>
    <line x1="-15" y1="-22" x2="35" y2="0" stroke="#F5A14A" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Handlebars -->
    <line x1="-15" y1="-22" x2="-15" y2="-42" stroke="#F5A14A" stroke-width="3" stroke-linecap="round"/>
    <line x1="-20" y1="-40" x2="-10" y2="-40" stroke="#F5A14A" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Seat post and seat -->
    <line x1="0" y1="8" x2="8" y2="-8" stroke="#F5A14A" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="12" cy="-15" rx="6" ry="3" fill="#F5A14A"/>
    
    <!-- Crank/pedal -->
    <circle cx="0" cy="8" r="3" fill="#F4F7F8"/>
    <line x1="0" y1="8" x2="8" y2="18" stroke="#F4F7F8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>